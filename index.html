<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E40AF" />
    <meta
      name="description"
      content="Nimbus Gestionale — gestione clienti, ordini e notifiche in tempo reale."
    />
    <title>Nimbus Gestionale</title>
    <!--
      Decodifica il redirect creato da public/404.html su GitHub Pages,
      ripristinando l'URL reale (es. /demoGestionaleperson/clienti) prima
      che React Router prenda il controllo.
    -->
    <script>
      (function () {
        var redirect = new URLSearchParams(window.location.search).get("redirect");
        if (redirect) {
          var base = window.location.pathname.replace(/\/$/, "");
          window.history.replaceState(null, "", base + "/" + redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
